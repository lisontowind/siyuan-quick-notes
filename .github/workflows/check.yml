name: Cross-platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser for isolated UI checks
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Check built pages with a simulated host
        if: runner.os == 'Linux'
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: isolated-ui-results
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 7
