<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>悬浮速记</title>
  <link rel="stylesheet" href="window.css">
  <script src="window.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <span id="title-display" title="拖动移动窗口">新速记</span>
    <button id="new" title="新建速记" aria-label="新建速记"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="open" title="在思源打开" aria-label="在思源打开"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
    <button id="pin" title="置顶" aria-label="置顶" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l-1 6 4 4H5l4-4-1-6ZM12 14v6"/></svg></button>
    <button id="more" title="更多" aria-label="更多" aria-expanded="false" aria-controls="actions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    <button id="minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button id="close" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </header>
  <div id="actions" hidden>
    <button id="save">立即保存 / 重试</button>
    <button id="reload">重新载入原文</button>
    <button id="copy-note">另存为新速记</button>
    <button id="close-draft">保存本机草稿后关闭</button>
    <button id="recent">最近速记与恢复草稿</button>
    <button id="delete" class="danger">删除这条速记…</button>
  </div>
  <main id="editor" aria-label="Markdown 速记"></main>
  <footer id="status" role="status" aria-live="polite">连接中…</footer>
</body>
</html>
